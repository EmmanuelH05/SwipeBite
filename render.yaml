# Render Blueprint — provisions the SwipeBite Postgres database and Express API.
# Deploy: Render dashboard → New → Blueprint → point at this repo.
# You will be prompted for the two `sync: false` secrets (JWT_SECRET, GOOGLE_API_KEY).
# Frontend deploys separately on Vercel (root dir: frontend) — see README.

databases:
  - name: swipebite-db
    plan: free
    databaseName: swipebite
    user: swipebite

services:
  - type: web
    name: swipebite-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swipebite-db
          property: connectionString
      - key: JWT_SECRET
        sync: false          # generate with: openssl rand -hex 32
      - key: GOOGLE_API_KEY
        sync: false          # Google Places API (New) key
      - key: FRONTEND_URL
        sync: false          # your Vercel URL — required, or CORS blocks the browser
      - key: NODE_ENV
        value: production
